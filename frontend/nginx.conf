server {
  listen 80;
  root /usr/share/nginx/html;
  # Uploads go through here; keep in step with the API's FILE_MAX_UPLOAD_MB (default 100)
  client_max_body_size 100m;

  # Look the API up through Docker's DNS on every request (cached 10 s), not once at startup:
  # when the api container is recreated or restarts on a new address, nginx keeps working
  # instead of answering 502 until it is restarted too.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
